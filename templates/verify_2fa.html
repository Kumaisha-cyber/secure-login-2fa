<!DOCTYPE html>
<html>

<head>

    <title>2FA Verification</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>🔐 Two-Factor Authentication</h1>

    <p>Enter your 6-digit OTP.</p>

    <form method="POST">

        <input
            type="text"
            name="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            required>

        <br><br>

        <button type="submit">
            Verify OTP
        </button>

    </form>

</body>

</html>
